[package]
name = "assemble-conops"
version = "0.1.0"
edition = "2021"
description = "Deterministic ConOps & Mission Intent Assembly Engine"

[dependencies]
deap-core = { path = "../deap-core" }
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"

[[bin]]
name = "assemble-conops"
path = "src/main.rs"

[lib]
name = "assemble_conops"
path = "src/lib.rs"
