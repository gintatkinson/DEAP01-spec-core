[package]
name = "compile-sysml"
version = "0.1.0"
edition = "2021"
description = "SysML v2 / KerML compiler, STPA safety transpiler, and specification synchronization engine"
autotests = false

[lints]
workspace = true


[dependencies]
deap-core = { path = "../deap-core" }
ariadne = { workspace = true }
camino = { workspace = true }
logos = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
ra_ap_line_index = { workspace = true }
ra_ap_syntax = { workspace = true }
ra_ap_text_edit = { workspace = true }
rowan = { workspace = true }
salsa = { workspace = true }
syn = { workspace = true }
pulldown-cmark = { workspace = true }
pulldown-cmark-to-cmark = { workspace = true }
toml_edit = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"

[[bin]]
name = "compile-sysml"
path = "src/main.rs"

[lib]
name = "compile_sysml"
path = "src/lib.rs"
doctest = false

[[test]]
name = "integration"
path = "tests/integration.rs"
