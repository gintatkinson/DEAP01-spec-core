[package]
name = "compile-sysml"
version = "0.1.0"
edition = "2021"
description = "SysML v2 / KerML compiler, STPA safety transpiler, and specification synchronization engine"

[dependencies]
deap-core = { path = "../deap-core" }
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"

[[bin]]
name = "compile-sysml"
path = "src/main.rs"

[lib]
name = "compile_sysml"
path = "src/lib.rs"
