[package]
name = "verify-baseline"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
deap-core = { path = "../deap-core" }
ingest-sysml = { path = "../ingest-sysml" }
compile-sysml = { path = "../compile-sysml" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"
pulldown-cmark = "0.13"
rayon = "1.12"

[lib]
doctest = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

