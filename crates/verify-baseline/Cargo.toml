[package]
name = "verify-baseline"
version = "0.1.0"
edition = "2021"
autotests = false

[dependencies]
deap-core = { path = "../deap-core" }
ingest-sysml = { path = "../ingest-sysml" }
compile-sysml = { path = "../compile-sysml" }
ariadne = { workspace = true }
camino = { workspace = true }
cargo_metadata = { workspace = true }
ra_ap_line_index = { workspace = true }
ra_ap_syntax = { workspace = true }
ra_ap_text_edit = { workspace = true }
toml_edit = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"
pulldown-cmark = { workspace = true }
pulldown-cmark-to-cmark = { workspace = true }
rayon = "1.12"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }

[lib]
doctest = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

