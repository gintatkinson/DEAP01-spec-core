[package]
name = "reconcile-backlog"
version = "0.1.0"
edition = "2021"
description = "Pure Rust Backlog Reconciler for DEAP MBSE Framework"

[lints]
workspace = true


[dependencies]
deap-core = { path = "../deap-core" }
ariadne = { workspace = true }
camino = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
pulldown-cmark = { workspace = true }
pulldown-cmark-to-cmark = { workspace = true }
ra_ap_syntax = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"

[[bin]]
name = "reconcile-backlog"
path = "src/main.rs"

[lib]
name = "reconcile_backlog"
path = "src/lib.rs"
doctest = false
