[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deap01-spec-core"
version = "0.1.0"
description = "Digital Pipeline Repository"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
parity-auditor = "parity_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["skills/spec-orchestrator/parity_auditor/src"]
