# ==============================================================================
# DEAP Production GitLab CI/CD Pipeline Specification
# Standard: RTCA DO-178C / DO-331 / ISO 15288 / ASTM F3269-17
# ==============================================================================

stages:
  - build
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:latest
  before_script:
    - rustc --version
    - cargo --version

build:toolchain:
  stage: build
  script:
    - echo "=== Building DEAP Native Rust Toolchain ==="
    - cargo build --release
  artifacts:
    paths:
      - target/release/verify-baseline
      - target/release/compile-sysml
      - target/release/reconcile-backlog
      - target/release/assemble-conops
      - target/release/ingest-sysml

test:baseline-conformance:
  stage: test
  dependencies:
    - build:toolchain
  script:
    - echo "=== Running Downstream Baseline Conformance Gate ==="
    - ./target/release/verify-baseline . --no-domain
    - echo "=== Running Spec Auditor Conformance Gate ==="
    - ./target/release/verify-baseline . --spec-only
