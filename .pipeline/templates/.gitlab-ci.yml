# ==============================================================================
# DEAP Production GitLab CI/CD Pipeline Specification
# Standard: RTCA DO-178C / DO-331 / ISO 15288 / ASTM F3269-17
# ==============================================================================

stages:
  - lint
  - test

variables:
  CARGO_TERM_COLOR: "always"

default:
  image: rust:1.85-slim
  before_script:
    - cargo --version
    - cargo build --release --workspace

lint:downstream-baseline:
  stage: lint
  script:
    - echo "=== Running Downstream Baseline Conformance Gate ==="
    - ./target/release/verify-baseline .

test:unit-and-parity:
  stage: test
  script:
    - echo "=== Running Cargo Workspace Verification Suite ==="
    - cargo test --workspace
