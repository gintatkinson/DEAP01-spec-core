[workspace]
members = [
    "crates/deap-core",
    "crates/verify-baseline",
    "crates/compile-sysml",
    "crates/ingest-sysml",
    "crates/assemble-conops",
    "crates/reconcile-backlog",
]
resolver = "2"

[workspace.dependencies]
ra_ap_syntax = "0.0.360"
rowan = "0.17.0"
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0.47"
prettyplease = { version = "0.3.0", features = ["verbatim"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_types = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "forbid"
type_complexity = "forbid"
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

