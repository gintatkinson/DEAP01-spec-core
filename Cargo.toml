[workspace]
members = [
    "crates/deap-core",
    "crates/verify-baseline",
    "crates/compile-sysml",
    "crates/ingest-sysml",
    "crates/assemble-conops",
    "crates/reconcile-backlog",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_types = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "forbid"
type_complexity = "forbid"
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
# Keeps legacy ratcheted files green during Streams 1-4 while verify-baseline (Step 1.2) and module-level #![deny(clippy::too_many_lines, clippy::too_many_arguments, clippy::undocumented_unsafe_blocks)] enforce <= 5 params on all non-ratcheted/new modules until Stream 5.4 flips [workspace.lints.clippy] to "deny".
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

