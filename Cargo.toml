[workspace]
members = [
    "crates/deap-core",
    "crates/verify-baseline",
    "crates/compile-sysml",
    "crates/ingest-sysml",
    "crates/assemble-conops",
    "crates/reconcile-backlog",
]
exclude = ["lints/deap-dylint-mir"]
resolver = "2"

[workspace.dependencies]
ariadne = "0.6.0"
camino = { version = "1.2.6", features = ["serde1"] }
cargo-lock = "11.1.0"
cargo-platform = "0.3.3"
cargo-util-schemas = "0.14.3"
cargo_metadata = "0.23.1"
ignore = "0.4.34"
logos = "0.16.1"
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"
pulldown-cmark = "0.13.4"
pulldown-cmark-to-cmark = "23.0.0"
quote = "1.0.47"
ra_ap_line_index = { package = "line-index", version = "0.1.2" }
ra_ap_paths = "0.0.360"
ra_ap_syntax = "0.0.360"
ra_ap_text_edit = "0.0.241"
ra_ap_vfs = "0.0.360"
rowan = "0.17.0"
salsa = "0.28.5"
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
toml_edit = "0.25.17"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
type_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
const_is_empty = "deny"
debug_assert_with_mut_call = "deny"
lossy_float_literal = "deny"
mutex_integer = "deny"
path_buf_push_overwrite = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
trailing_empty_array = "deny"
tuple_array_conversions = "deny"
# Keeps legacy ratcheted files green during Streams 1-4 while verify-baseline (Step 1.2) and module-level #![deny(clippy::too_many_lines, clippy::too_many_arguments, clippy::undocumented_unsafe_blocks)] enforce <= 5 params on all non-ratcheted/new modules until Stream 5.4 flips [workspace.lints.clippy] to "deny".
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

